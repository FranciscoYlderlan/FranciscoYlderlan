<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 18" width="1000" height="18" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00E5A0" stop-opacity="0.45"/>
      <stop offset="52%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="84%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DFFD1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </linearGradient>
    <filter id="g2" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="8" width="1000" height="1.6" fill="url(#base)"/>
  <g filter="url(#g2)">
    <rect x="-220" y="7.2" width="220" height="3" rx="1.5" fill="url(#pulse)">
      <animate attributeName="x" values="-220;1000" dur="4.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/>
    </rect>
  </g>
  <circle cx="0" cy="8.8" r="2.6" fill="#7DFFD1" filter="url(#g2)">
    <animate attributeName="cx" values="0;1000" dur="4.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/>
  </circle>
</svg>
