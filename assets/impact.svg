<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Engineering impact metrics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pnl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="100%" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#00E5A0"/><stop offset="100%" stop-color="#7DFFD1"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#93E4FF"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#D6C7FF"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFB86C"/><stop offset="100%" stop-color="#FFD9AC"/></linearGradient>
    <filter id="gl" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .m { font-family: "SFMono-Regular","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace; }
    .lbl { fill:#C9D1D9; font-size:13.5px; }
    .sub { fill:#6E7681; font-size:11.5px; }
    .val { font-size:19px; }
  </style>

  <rect x="6" y="6" width="988" height="288" rx="14" fill="url(#pnl)" stroke="#1F2937" stroke-width="1.5"/>
  <text class="m" x="30" y="42" font-size="12.5" fill="#6E7681" letter-spacing="2">$ git log --format=impact --since=2018</text>
  <line x1="30" y1="58" x2="970" y2="58" stroke="#1A2230"/>

  <!-- row 1 -->
  <g>
    <text class="m lbl" x="30" y="92">Mentee job-acquisition rate</text>
    <text class="m sub" x="30" y="110">TM Mentoring · legacy script refactor</text>
    <rect x="360" y="82" width="470" height="10" rx="5" fill="#141B26"/>
    <rect x="360" y="82" width="0" height="10" rx="5" fill="url(#b1)" filter="url(#gl)">
      <animate attributeName="width" values="0;470" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 0.9 0.2 1"/>
    </rect>
    <text class="m val" x="960" y="95" fill="#00E5A0" text-anchor="end" opacity="0">+900%
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
    </text>
  </g>

  <!-- row 2 -->
  <g>
    <text class="m lbl" x="30" y="148">Manual research workload removed</text>
    <text class="m sub" x="30" y="166">Public Health Dept · dataset automation</text>
    <rect x="360" y="138" width="470" height="10" rx="5" fill="#141B26"/>
    <rect x="360" y="138" width="0" height="10" rx="5" fill="url(#b2)" filter="url(#gl)">
      <animate attributeName="width" values="0;400" dur="1.6s" begin="0.45s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 0.9 0.2 1"/>
    </rect>
    <text class="m val" x="960" y="151" fill="#38BDF8" text-anchor="end" opacity="0">6h / day
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.75s" fill="freeze"/>
    </text>
  </g>

  <!-- row 3 -->
  <g>
    <text class="m lbl" x="30" y="204">Big Data preprocessing time</text>
    <text class="m sub" x="30" y="222">NCA-UFMA · ETL redesign — 4h to 20min</text>
    <rect x="360" y="194" width="470" height="10" rx="5" fill="#141B26"/>
    <rect x="360" y="194" width="0" height="10" rx="5" fill="url(#b3)" filter="url(#gl)">
      <animate attributeName="width" values="0;432" dur="1.6s" begin="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 0.9 0.2 1"/>
    </rect>
    <text class="m val" x="960" y="207" fill="#A78BFA" text-anchor="end" opacity="0">&#8722;92%
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2s" fill="freeze"/>
    </text>
  </g>

  <!-- row 4 -->
  <g>
    <text class="m lbl" x="30" y="260">Third-party tooling cost</text>
    <text class="m sub" x="30" y="278">In-house platform replacing paid SaaS</text>
    <rect x="360" y="250" width="470" height="10" rx="5" fill="#141B26"/>
    <rect x="360" y="250" width="0" height="10" rx="5" fill="url(#b4)" filter="url(#gl)">
      <animate attributeName="width" values="0;470" dur="1.6s" begin="0.95s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 0.9 0.2 1"/>
    </rect>
    <text class="m val" x="960" y="263" fill="#FFB86C" text-anchor="end" opacity="0">&#8594; R$ 0
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.25s" fill="freeze"/>
    </text>
  </g>
</svg>
