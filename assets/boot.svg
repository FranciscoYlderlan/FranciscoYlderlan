<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="1000" height="372" role="img" aria-label="Terminal boot sequence for Francisco Ylderlan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5A0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1B2430" stroke-width="1" opacity="0.5"/>
    </pattern>

    <clipPath id="cName"><rect x="44" y="82" width="0" height="46">
      <animate attributeName="width" values="0;520" dur="1.5s" begin="0.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
    </rect></clipPath>
    <clipPath id="cRole"><rect x="44" y="140" width="0" height="26">
      <animate attributeName="width" values="0;620" dur="0.9s" begin="1.75s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="cL1"><rect x="44" y="196" width="0" height="22"><animate attributeName="width" values="0;700" dur="0.45s" begin="2.75s" fill="freeze"/></rect></clipPath>
    <clipPath id="cL2"><rect x="44" y="226" width="0" height="22"><animate attributeName="width" values="0;700" dur="0.45s" begin="3.15s" fill="freeze"/></rect></clipPath>
    <clipPath id="cL3"><rect x="44" y="256" width="0" height="22"><animate attributeName="width" values="0;700" dur="0.45s" begin="3.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="cL4"><rect x="44" y="286" width="0" height="22"><animate attributeName="width" values="0;700" dur="0.45s" begin="3.95s" fill="freeze"/></rect></clipPath>
    <clipPath id="cL5"><rect x="44" y="316" width="0" height="22"><animate attributeName="width" values="0;700" dur="0.45s" begin="4.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="panelClip"><rect x="8" y="8" width="984" height="356" rx="14"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", Menlo, monospace; }
    .dim  { fill: #6E7681; }
    .txt  { fill: #C9D1D9; }
    .acc  { fill: #00E5A0; }
    .cya  { fill: #38BDF8; }
    .vio  { fill: #A78BFA; }
    .amb  { fill: #FFB86C; }
  </style>

  <rect x="8" y="8" width="984" height="356" rx="14" fill="url(#panel)" stroke="#1F2937" stroke-width="1.5"/>
  <g clip-path="url(#panelClip)">
    <rect x="8" y="8" width="984" height="356" fill="url(#grid)" opacity="0.55"/>
    <ellipse cx="820" cy="120" rx="260" ry="180" fill="url(#halo)"/>
    <rect x="8" y="8" width="984" height="70" fill="url(#scan)" opacity="0.8">
      <animate attributeName="y" values="8;300;8" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="8" y="8" width="984" height="356" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.85"/>

  <!-- title bar -->
  <path d="M8 22a14 14 0 0 1 14-14h956a14 14 0 0 1 14 14v22H8z" fill="#11161F"/>
  <line x1="8" y1="44" x2="992" y2="44" stroke="#1F2937" stroke-width="1"/>
  <circle cx="34" cy="26" r="5.5" fill="#FF5F57"/>
  <circle cx="54" cy="26" r="5.5" fill="#FEBC2E"/>
  <circle cx="74" cy="26" r="5.5" fill="#28C840"/>
  <text class="mono dim" x="500" y="31" font-size="12.5" text-anchor="middle">ylderlan@github — ~/profile — zsh — 120x32</text>

  <!-- name -->
  <g clip-path="url(#cName)">
    <text class="mono acc" x="44" y="118" font-size="34" letter-spacing="5" filter="url(#glow)" opacity="0.55">FRANCISCO YLDERLAN</text>
    <text class="mono" x="44" y="118" font-size="34" letter-spacing="5" fill="#E6EDF3">FRANCISCO YLDERLAN</text>
  </g>

  <!-- role -->
  <g clip-path="url(#cRole)">
    <text class="mono" x="44" y="159" font-size="15">
      <tspan class="acc">&#62;</tspan><tspan class="txt" dx="8">Software Engineer</tspan><tspan class="dim" dx="8">·</tspan><tspan class="cya" dx="8">Full-Stack</tspan><tspan class="dim" dx="8">·</tspan><tspan class="vio" dx="8">AI-Driven Systems</tspan>
    </text>
  </g>

  <!-- boot log -->
  <g clip-path="url(#cL1)">
    <text class="mono" x="44" y="212" font-size="14"><tspan class="dim">$</tspan><tspan class="txt" dx="10">ssh ylderlan@profile --verify</tspan><tspan class="acc" dx="14">[ OK ]</tspan></text>
  </g>
  <g clip-path="url(#cL2)">
    <text class="mono" x="44" y="242" font-size="14"><tspan class="dim">&#9500;&#9472; stack</tspan><tspan class="dim" dx="6">......</tspan><tspan class="txt" dx="10">Node · React · Next · NestJS · C# / .NET · SQL</tspan></text>
  </g>
  <g clip-path="url(#cL3)">
    <text class="mono" x="44" y="272" font-size="14"><tspan class="dim">&#9500;&#9472; infra</tspan><tspan class="dim" dx="6">......</tspan><tspan class="txt" dx="10">GCP · Docker · Kubernetes · CI/CD · Microservices</tspan></text>
  </g>
  <g clip-path="url(#cL4)">
    <text class="mono" x="44" y="302" font-size="14"><tspan class="dim">&#9500;&#9472; focus</tspan><tspan class="dim" dx="6">......</tspan><tspan class="txt" dx="10">LLM &amp; multi-agent systems, automation, data platforms</tspan></text>
  </g>
  <g clip-path="url(#cL5)">
    <text class="mono" x="44" y="332" font-size="14"><tspan class="dim">&#9492;&#9472; where</tspan><tspan class="dim" dx="6">......</tspan><tspan class="txt" dx="10">São Paulo, Brazil</tspan><tspan class="dim" dx="10">·</tspan><tspan class="amb" dx="10">remote-first</tspan></text>
  </g>

  <!-- cursor -->
  <rect x="462" y="318" width="10" height="18" fill="#00E5A0" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.01s" begin="4.8s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" begin="4.9s" repeatCount="indefinite"/>
  </rect>

  <!-- status pill -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="5.1s" fill="freeze"/>
    <rect x="726" y="94" width="230" height="36" rx="18" fill="#0E1A16" stroke="#00E5A0" stroke-opacity="0.45"/>
    <circle cx="750" cy="112" r="5" fill="#00E5A0">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text class="mono acc" x="766" y="117" font-size="12" letter-spacing="0.8">OPEN TO OPPORTUNITIES</text>
  </g>
</svg>
