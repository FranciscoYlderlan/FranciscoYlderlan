<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-label="How I build: system architecture map" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="100%" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131B26"/><stop offset="100%" stop-color="#0F1620"/>
    </linearGradient>
    <filter id="ng" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="p1" d="M190 128 H250"/>
    <path id="p2" d="M400 128 C435 128 435 82 470 82"/>
    <path id="p3" d="M400 128 C435 128 435 180 470 180"/>
    <path id="p4" d="M640 82 C680 82 680 128 720 128"/>
    <path id="p5" d="M640 180 C680 180 680 128 720 128"/>
  </defs>
  <style>
    .m { font-family: "SFMono-Regular","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace; }
    .nt { fill:#E6EDF3; font-size:13px; letter-spacing:1.2px; }
    .ns { fill:#6E7681; font-size:10.5px; }
    .wire { fill:none; stroke:#233042; stroke-width:1.6; }
    .flow { fill:none; stroke:#00E5A0; stroke-width:1.6; stroke-opacity:0.75; stroke-dasharray:6 10; }
  </style>

  <rect x="6" y="6" width="988" height="298" rx="14" fill="url(#ap)" stroke="#1F2937" stroke-width="1.5"/>
  <text class="m" x="30" y="40" font-size="12.5" fill="#6E7681" letter-spacing="2">$ systemctl status ylderlan.service</text>
  <circle cx="952" cy="35" r="4.5" fill="#00E5A0"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text class="m" x="940" y="39" font-size="11" fill="#00E5A0" text-anchor="end">active (running)</text>
  <line x1="30" y1="54" x2="970" y2="54" stroke="#1A2230"/>

  <!-- wires -->
  <path class="wire" d="M190 128 H250"/>
  <path class="wire" d="M400 128 C435 128 435 82 470 82"/>
  <path class="wire" d="M400 128 C435 128 435 180 470 180"/>
  <path class="wire" d="M640 82 C680 82 680 128 720 128"/>
  <path class="wire" d="M640 180 C680 180 680 128 720 128"/>
  <path class="flow" d="M190 128 H250"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.2s" repeatCount="indefinite"/></path>
  <path class="flow" d="M400 128 C435 128 435 82 470 82"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.4s" repeatCount="indefinite"/></path>
  <path class="flow" d="M400 128 C435 128 435 180 470 180"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.6s" repeatCount="indefinite"/></path>
  <path class="flow" d="M640 82 C680 82 680 128 720 128"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.4s" repeatCount="indefinite"/></path>
  <path class="flow" d="M640 180 C680 180 680 128 720 128"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.6s" repeatCount="indefinite"/></path>

  <!-- packets -->
  <circle r="3.4" fill="#7DFFD1" filter="url(#ng)"><animateMotion dur="2.6s" repeatCount="indefinite" path="M190 128 H250"/></circle>
  <circle r="3.4" fill="#7DFFD1" filter="url(#ng)"><animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite" path="M400 128 C435 128 435 82 470 82"/></circle>
  <circle r="3.4" fill="#A78BFA" filter="url(#ng)"><animateMotion dur="2.2s" begin="0.9s" repeatCount="indefinite" path="M400 128 C435 128 435 180 470 180"/></circle>
  <circle r="3.4" fill="#38BDF8" filter="url(#ng)"><animateMotion dur="2.2s" begin="1.2s" repeatCount="indefinite" path="M640 82 C680 82 680 128 720 128"/></circle>
  <circle r="3.4" fill="#38BDF8" filter="url(#ng)"><animateMotion dur="2.2s" begin="1.7s" repeatCount="indefinite" path="M640 180 C680 180 680 128 720 128"/></circle>

  <!-- nodes -->
  <g>
    <rect x="40" y="96" width="150" height="64" rx="10" fill="url(#node)" stroke="#00E5A0" stroke-opacity="0.35"/>
    <text class="m nt" x="115" y="122" text-anchor="middle">CLIENT</text>
    <text class="m ns" x="115" y="140" text-anchor="middle">React · Next · Native</text>
  </g>
  <g>
    <rect x="250" y="96" width="150" height="64" rx="10" fill="url(#node)" stroke="#00E5A0" stroke-opacity="0.45"/>
    <text class="m nt" x="325" y="122" text-anchor="middle">API EDGE</text>
    <text class="m ns" x="325" y="140" text-anchor="middle">NestJS · .NET · REST</text>
  </g>
  <g>
    <rect x="470" y="52" width="170" height="60" rx="10" fill="url(#node)" stroke="#38BDF8" stroke-opacity="0.4"/>
    <text class="m nt" x="555" y="77" text-anchor="middle">SERVICES</text>
    <text class="m ns" x="555" y="95" text-anchor="middle">microservices · payments</text>
  </g>
  <g>
    <rect x="470" y="150" width="170" height="60" rx="10" fill="url(#node)" stroke="#A78BFA" stroke-opacity="0.5"/>
    <text class="m nt" x="555" y="175" text-anchor="middle">AI LAYER</text>
    <text class="m ns" x="555" y="193" text-anchor="middle">LLM · agents · n8n</text>
    <rect x="470" y="150" width="170" height="60" rx="10" fill="none" stroke="#A78BFA" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.15;0.75;0.15" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <rect x="720" y="96" width="180" height="64" rx="10" fill="url(#node)" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text class="m nt" x="810" y="122" text-anchor="middle">DATA</text>
    <text class="m ns" x="810" y="140" text-anchor="middle">Postgres · Redis · Elastic</text>
  </g>

  <!-- platform band -->
  <rect x="40" y="238" width="860" height="42" rx="10" fill="#0F1620" stroke="#1F2937"/>
  <text class="m" x="470" y="264" font-size="11.5" fill="#6E7681" text-anchor="middle" letter-spacing="1.6">GCP &#183; DOCKER &#183; KUBERNETES &#183; CI/CD &#183; TESTING &#183; OBSERVABILITY</text>
  <rect x="40" y="277" width="130" height="2" rx="1" fill="#00E5A0" opacity="0.7" filter="url(#ng)">
    <animate attributeName="x" values="40;770;40" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </rect>
</svg>
