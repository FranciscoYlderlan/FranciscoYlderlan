<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Terminal footer: connect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="100%" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="fe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="fc"><rect x="34" y="44" width="0" height="26">
      <animate attributeName="width" values="0;520" dur="1.5s" begin="0.3s" fill="freeze"/>
    </rect></clipPath>
    <filter id="fg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>.m{font-family:"SFMono-Regular","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;}</style>

  <rect x="6" y="6" width="988" height="118" rx="14" fill="url(#fp)" stroke="#1F2937" stroke-width="1.5"/>
  <rect x="6" y="6" width="988" height="118" rx="14" fill="none" stroke="url(#fe)" stroke-width="1.4" opacity="0.7"/>

  <g clip-path="url(#fc)">
    <text class="m" x="34" y="64" font-size="15">
      <tspan fill="#6E7681">$</tspan><tspan fill="#C9D1D9" dx="10">./connect --with</tspan><tspan fill="#00E5A0" dx="8">francisco-ylderlan</tspan>
    </text>
  </g>
  <rect x="558" y="48" width="9" height="19" fill="#00E5A0" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.01s" begin="1.8s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" begin="1.9s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.2s" fill="freeze"/>
    <circle cx="36" cy="92" r="4.5" fill="#00E5A0" filter="url(#fg)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="52" y="96" font-size="12" fill="#6E7681">connection established &#183; open to collaboration, freelance and full-time roles</text>
  </g>

  <rect x="0" y="122" width="180" height="2" fill="#00E5A0" opacity="0.8" filter="url(#fg)">
    <animate attributeName="x" values="-180;1000" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
